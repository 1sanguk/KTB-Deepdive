services:
  chatbot:
    image: parksteve/chatbot:latest
    ports:
      - "8000:8000"
    env_file:
      - api_keys
    volumes:
      - ./source/data:/app/source/data
      - ./source/.cache:/app/source/.cache
      - hf_cache:/root/.cache/huggingface
      # source/model 전체 마운트 (.dockerignore로 이미지에서 제외되므로 호스트에서 제공)
      - ./source/model:/app/source/model
    restart: unless-stopped

volumes:
  hf_cache:
