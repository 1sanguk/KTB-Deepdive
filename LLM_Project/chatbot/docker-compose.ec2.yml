services:
  chatbot:
    image: parksteve/chatbot:latest
    ports:
      - "8000:8000"
    env_file:
      - api_keys
    volumes:
      - ./source/model:/app/source/model
      - ./source/data:/app/source/data
      - ./source/.cache:/app/source/.cache
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  hf_cache:
